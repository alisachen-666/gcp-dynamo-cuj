# M4R MESH-WARM BURST — forces the full 24x48 rank-pair mesh to wire up at once, WITHOUT a
# full bench. Real 8k prompts (real KV bulk sizes), OSL 32 (fast drain), conc 512 flooded at
# rate inf = maximal simultaneous UCX wire-up storm. Healthy run finishes in ~3-6 min; the
# kv-transport-guard watch kills it within minutes of the first wireup/NIXL violation.
# activeDeadlineSeconds hard-caps the whole probe at 30 min regardless of orchestrator state.
apiVersion: batch/v1
kind: Job
metadata:
  name: dsr1-m4r-meshwarm
  namespace: dynamo-cloud
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dsr1-m4r-bench
    spec:
      restartPolicy: Never
      nodeSelector: {cloud.google.com/gke-nodepool: np-3}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: bench
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          FRONTEND=dsr1-m4r-frontend.dynamo-cloud.svc.cluster.local
          python3 -c "import aiohttp, numpy, pandas, datasets, PIL, tqdm, transformers" 2>/dev/null \
            || pip install --quiet aiohttp numpy pandas datasets Pillow tqdm transformers
          for i in $(seq 1 60); do
            curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek && break; sleep 10
          done
          curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek || { echo "FRONTEND NOT SERVING"; exit 1; }
          echo "frontend serving; MESH-WARM BURST: conc 512, 1024 x 8k prompts, OSL 32, rate inf"
          cp /sa-bench/*.py /tmp/ && cd /tmp
          python3 -u benchmark_serving.py \
            --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
            --host ${FRONTEND} --port 8000 \
            --backend dynamo --endpoint /v1/completions \
            --disable-tqdm --dataset-name random \
            --num-prompts 1024 \
            --random-input-len 8192 --random-output-len 32 --random-range-ratio 0.8 \
            --ignore-eos --request-rate inf \
            --percentile-metrics ttft,tpot,itl,e2el \
            --max-concurrency 512 --trust-remote-code
          echo "MESH-WARM BURST COMPLETED"
        env:
        - name: HF_HOME
          value: /tmp/hf
        resources:
          requests:
            cpu: "16"
            memory: 32Gi
        volumeMounts:
        - name: sa-bench
          mountPath: /sa-bench
      volumes:
      - name: sa-bench
        configMap:
          name: sa-bench-scripts
