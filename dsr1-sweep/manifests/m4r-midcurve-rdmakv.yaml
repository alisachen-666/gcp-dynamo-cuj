# DSR1-M4R: RDMA-KV DIAGNOSTIC — identical to m4n-midcurve-nats.yaml except the KV-transfer path rides
# GPUDirect RDMA (rc_x) instead of MNNVL cuda_ipc: UCX_TLS=cuda_copy,rc_x,tcp, MNNVL-ipc
# enabler removed, and every worker claims 8 mrdma NICs via DRA (schedule-time allocation).
# NCCL/DeepEP collectives stay on NVLink (NCCL_MNNVL_ENABLE untouched). Targets the -6.0% mid conc-2048 gap.
# Verify per run: UCX_PROTO_INFO shows rc_mlx5 for CUDA transfers, not cuda_ipc/tcp.
# Rev2 (2026-08-05): +UCX_IB_GID_INDEX=5 — sysfs shows GIDs 0-3 map to host-ns netdevs
# (gpu0rdma0, unreachable in pod -> UCX ifindex errors) while GID 4/5 map to the in-pod
# gpu0ipvlan0. Pinning index 5 (RoCE v2, canonical value from worker-env-canonical rev2)
# targets the only pod-resolvable GID.
# Rev4 VALIDATED (2026-08-06, mesh test): mesh-warm storm 1024/1024 in 100.6s, wireup=0,
# nixl=0, rc_mlx5=4663 — vs rev3 same-gate 5 wireup errors at probe scale. Fix: +UCX_NET_DEVICES=mlx5_0..7 (explicit ORDERED device list on
# every worker -> consistent UCX lane indexing across pods; targets the mesh "no remote ep
# address for lane" wire-up failures) + dual gib installers (apt + plugin-image, reference
# template both branches) per user directive.
# Rev3 (2026-08-05): +UCX_IB_ROCE_LOCAL_SUBNET=y +UCX_IB_ROCE_SUBNET_PREFIX_LEN=64 —
# rev2 at scale died with NIXL_ERR_REMOTE_DISCONNECT because default UCX pairs RoCE
# devices cross-rail (rails = 8 disjoint /64s, no inter-rail routes). Same-subnet-only
# pairing keeps every endpoint pair on one rail. Gate on a passing m2r rev3 smoke first.
# M4N: NATS-request-plane A/B of the official M4 mid_curve conc-2048 point.
# IDENTICAL to m4-midcurve.yaml except: (1) names m4->m4n, (2) workers pass --request-plane nats
# and the frontend sets DYN_REQUEST_PLANE=nats (matching srtctl, which injects the flag from the
# recipe's dynamo.request_plane: "nats"; our original run fell back to dynamo 0.8.1's TCP default
# — confirmed in dsr1-m4-decode-0.log). Purpose: isolate the request-plane contribution to the
# mid_curve TPOT gap vs InferenceX (+41% at conc 2048) at equal throughput.
# M4: FULL 8k1k mid_curve — srt-slurm recipes/gb300-fp4/8k1k/mid_curve.yaml on GKE.
# 6 prefill workers (1 node TP=4 each) + 1 decode worker (12 nodes, TP=EP=DP=48, DeepEP)
# + 10 frontends. 72 GPUs. Image: exact InferenceX pin + dynamo 0.8.1 wheels.
# Deviation from srt-slurm noted: k8s Service load-balances frontends (they use nginx:1.27.4).
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsr1-m4r-cd
  namespace: dynamo-cloud
spec:
  numNodes: 18
  channel:
    resourceClaimTemplate:
      name: dsr1-m4r-cd-channel
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1-m4r-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: dsr1-m4r-frontend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1-m4r-decode
  namespace: dynamo-cloud
spec:
  clusterIP: None
  selector:
    app: dsr1-m4r-decode
  ports:
  - port: 5757
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1-m4r-frontend
  namespace: dynamo-cloud
spec:
  replicas: 10
  selector:
    matchLabels:
      app: dsr1-m4r-frontend
  template:
    metadata:
      labels:
        app: dsr1-m4r-frontend
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: frontend
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          # mirror small files to /model — MUST equal the workers' registered model path
          until python3 -c "
          from huggingface_hub import snapshot_download
          import shutil, glob, os
          p = snapshot_download('nvidia/DeepSeek-R1-0528-NVFP4-v2', allow_patterns=['*.json','*.py','tokenizer*','*.txt'])
          os.makedirs('/model', exist_ok=True)
          [shutil.copy(f, '/model/') for f in glob.glob(p + '/*') if os.path.isfile(f)]
          "; do echo "small-file mirror failed, retry in 60s"; sleep 60; done
          exec python3 -m dynamo.frontend --http-port=8000
        env:
        - name: DYN_REQUEST_PLANE
          value: "nats"
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: HF_HOME
          value: /tmp/hf
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - {name: model, mountPath: /model}
      volumes:
      - name: model
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1-m4r-prefill
  namespace: dynamo-cloud
spec:
  replicas: 6
  selector:
    matchLabels:
      app: dsr1-m4r-prefill
  template:
    metadata:
      labels:
        app: dsr1-m4r-prefill
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: rdma
        resourceClaimTemplateName: mrdma-all
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1-m4r-cd-channel
      initContainers:
      # NCCL gIB plugin (GPUDirect RoCE transport for NCCL) — raw-manifest port of
      # gpu-recipes network.gibInstall method=apt. Stages /usr/local/gib for the worker.
      - name: nccl-gib-apt-installer
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /etc/apt/trusted.gpg.d/cloud.google.gpg
          echo 'deb https://packages.cloud.google.com/apt gpudirect-gib-apt main' > /etc/apt/sources.list.d/nccl-gib.list
          apt-get update
          apt-get install -y --no-install-recommends nccl-gib
          test -f /usr/local/gib/scripts/set_nccl_env.sh
          mkdir -p /target/usr/local/gib
          cp -a /usr/local/gib/. /target/usr/local/gib/
        volumeMounts:
        - {name: gib, mountPath: /target/usr/local/gib}
      - name: nccl-plugin-installer
        image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic-arm64:v1.0.7
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -ex
          /scripts/container_entry.sh install --install-nccl
          mkdir -p /target/usr/local/gib/lib64
          cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
          cp -R /var/lib/gib/. /target/usr/local/gib
        volumeMounts:
        - {name: gib, mountPath: /target/usr/local/gib}
      containers:
      - name: prefill
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          [ -f /model/model.safetensors.index.json ] || { echo "MODEL NOT SEEDED on this node"; exit 1; }
          exec python3 -m dynamo.sglang \
            --model-path /model \
            --served-model-name deepseek-ai/DeepSeek-R1 \
            --disaggregation-mode prefill \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --attention-backend trtllm_mla \
            --quantization modelopt_fp4 \
            --moe-runner-backend flashinfer_trtllm \
            --disable-radix-cache \
            --disable-chunked-prefix-cache \
            --stream-interval 50 \
            --decode-log-interval 1000 \
            --watchdog-timeout 1000000 \
            --context-length 9600 \
            --disable-shared-experts-fusion \
            --disaggregation-bootstrap-port 30001 \
            --mem-fraction-static 0.95 \
            --max-total-tokens 131072 \
            --max-prefill-tokens 524288 \
            --chunked-prefill-size 131072 \
            --max-running-requests 30000 \
            --load-balance-method round_robin \
            --disable-cuda-graph \
            --fp4-gemm-backend flashinfer_cutlass \
            --disaggregation-transfer-backend nixl \
            --request-plane nats \
            --tensor-parallel-size 4 \
            --data-parallel-size 1 \
            --expert-parallel-size 1 \
            --host 0.0.0.0
        env:
        - name: LD_LIBRARY_PATH
          value: "/usr/local/gib/lib64:/usr/local/ucx/lib:/usr/local/ucx/lib/ucx:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/plugins:/usr/local/nvidia/lib64"
        - name: NCCL_DEBUG
          value: "VERSION"
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        # srt-slurm mid_curve prefill_environment (verbatim)
        - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
          value: "1800"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DYN_SKIP_SGLANG_LOG_FORMATTING
          value: "1"
        - name: SGLANG_NVFP4_CKPT_FP8_GEMM_IN_ATTN
          value: "1"
        - name: SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2
          value: "1"
        - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
          value: "100000"
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: "100000"
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: "100000"
        - name: MC_TE_METRIC
          value: "true"
        - name: MC_FORCE_MNNVL
          value: "1"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: "True"
        - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
          value: "0"
        - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
          value: "1"
        # GKE canonical transport block (tested in M2)
        - name: UCX_TLS
          value: "cuda_copy,rc_x,tcp"
        - name: UCX_NET_DEVICES
          value: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1"
        - name: UCX_IB_GID_INDEX
          value: "5"
        # rev3 (2026-08-05): rail-aware endpoint pairing — rails are 8 disjoint /64s with
        # no cross-rail routing; restrict RoCE pairing to same-subnet (mlx5_k<->mlx5_k)
        # so fan-out never creates unroutable cross-rail pairs (the rev2 failure mode).
        - name: UCX_IB_ROCE_LOCAL_SUBNET
          value: "y"
        - name: UCX_IB_ROCE_SUBNET_PREFIX_LEN
          value: "64"
        - name: UCX_MEMTYPE_CACHE
          value: "n"
        - name: UCX_MEMTYPE_REG_WHOLE
          value: "n"
        - name: UCX_PROTO_INFO
          value: "y"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: rdma
          - name: compute-domain-channel
        volumeMounts:
        - {name: gib, mountPath: /usr/local/gib, readOnly: true}
        - {name: dshm, mountPath: /dev/shm}
        - {name: model, mountPath: /model, readOnly: true}
      volumes:
      - {name: gib, emptyDir: {}}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 128Gi}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-model, type: Directory}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsr1-m4r-decode
  namespace: dynamo-cloud
spec:
  serviceName: dsr1-m4r-decode
  replicas: 12
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: dsr1-m4r-decode
  template:
    metadata:
      labels:
        app: dsr1-m4r-decode
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: rdma
        resourceClaimTemplateName: mrdma-all
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1-m4r-cd-channel
      initContainers:
      # NCCL gIB plugin (GPUDirect RoCE transport for NCCL) — raw-manifest port of
      # gpu-recipes network.gibInstall method=apt. Stages /usr/local/gib for the worker.
      - name: nccl-gib-apt-installer
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /etc/apt/trusted.gpg.d/cloud.google.gpg
          echo 'deb https://packages.cloud.google.com/apt gpudirect-gib-apt main' > /etc/apt/sources.list.d/nccl-gib.list
          apt-get update
          apt-get install -y --no-install-recommends nccl-gib
          test -f /usr/local/gib/scripts/set_nccl_env.sh
          mkdir -p /target/usr/local/gib
          cp -a /usr/local/gib/. /target/usr/local/gib/
        volumeMounts:
        - {name: gib, mountPath: /target/usr/local/gib}
      - name: nccl-plugin-installer
        image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic-arm64:v1.0.7
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -ex
          /scripts/container_entry.sh install --install-nccl
          mkdir -p /target/usr/local/gib/lib64
          cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
          cp -R /var/lib/gib/. /target/usr/local/gib
        volumeMounts:
        - {name: gib, mountPath: /target/usr/local/gib}
      containers:
      - name: decode
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          [ -f /model/model.safetensors.index.json ] || { echo "MODEL NOT SEEDED on this node"; exit 1; }
          RANK=${POD_INDEX}
          echo "decode node-rank=$RANK"
          exec python3 -m dynamo.sglang \
