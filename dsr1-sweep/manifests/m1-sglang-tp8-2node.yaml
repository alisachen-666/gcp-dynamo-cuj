# M1: 2-node sglang TP=8 DSR1 NVFP4 over MNNVL (np-2, one NVL72 subblock).
# Node 0 serves + runs a short sa-bench; node 1 is a TP worker that exits when node 0's
# server goes away after having been healthy.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsr1-m1-cd
  namespace: default
spec:
  numNodes: 2
  channel:
    resourceClaimTemplate:
      name: dsr1-m1-cd-channel
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1-m1
  namespace: default
spec:
  clusterIP: None
  selector:
    job-name: dsr1-m1-tp8
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dsr1-m1-tp8
  namespace: default
spec:
  backoffLimit: 0
  completions: 2
  parallelism: 2
  completionMode: Indexed
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dsr1-m1-tp8
    spec:
      restartPolicy: Never
      subdomain: dsr1-m1
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      resourceClaims:
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1-m1-cd-channel
      containers:
      - name: sglang
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          MASTER=dsr1-m1-tp8-0.dsr1-m1.default.svc.cluster.local
          echo "node_rank=$JOB_COMPLETION_INDEX host=$(hostname)"
          python3 -m sglang.launch_server \
            --model-path nvidia/DeepSeek-R1-0528-NVFP4-v2 \
            --served-model-name deepseek-ai/DeepSeek-R1 \
            --trust-remote-code \
            --tp 8 \
            --nnodes 2 \
            --node-rank $JOB_COMPLETION_INDEX \
            --dist-init-addr ${MASTER}:5757 \
            --quantization modelopt_fp4 \
            --kv-cache-dtype fp8_e4m3 \
            --attention-backend trtllm_mla \
            --moe-runner-backend flashinfer_trtllm \
            --disable-radix-cache \
            --disable-chunked-prefix-cache \
            --disable-shared-experts-fusion \
            --context-length 9600 \
            --mem-fraction-static 0.85 \
            --host 0.0.0.0 --port 30000 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          # wait for master health (weights download ~420 GB/node on first run)
          up=0
          for i in $(seq 1 540); do
            curl -sf http://${MASTER}:30000/health >/dev/null 2>&1 && { up=1; break; }
            kill -0 $SERVER_PID 2>/dev/null || { echo "SERVER PROCESS DIED"; tail -80 /tmp/server.log; exit 1; }
            sleep 10
            if (( i % 30 == 0 )); then echo "waiting for master health... ($((i/6)) min)"; tail -2 /tmp/server.log; fi
          done
          [ "$up" = "1" ] || { echo "TIMEOUT waiting for health"; tail -80 /tmp/server.log; exit 1; }
          echo "master healthy"
          if [ "$JOB_COMPLETION_INDEX" = "0" ]; then
            python3 -c "import aiohttp, numpy, pandas, datasets, PIL, tqdm, transformers" 2>/dev/null \
              || pip install --quiet aiohttp numpy pandas datasets Pillow tqdm transformers
            cp /sa-bench/*.py /tmp/ && cd /tmp && mkdir -p /tmp/results
            for conc in 4 16; do
              python3 -u benchmark_serving.py \
                --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
                --host 127.0.0.1 --port 30000 \
                --backend dynamo --endpoint /v1/completions \
                --disable-tqdm --dataset-name random \
                --num-prompts $((conc * 4)) \
                --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
                --ignore-eos --request-rate inf \
                --percentile-metrics ttft,tpot,itl,e2el \
                --max-concurrency ${conc} --trust-remote-code \
                --save-result --result-dir /tmp/results \
                --result-filename results_concurrency_${conc}_gpus_8.json
            done
            for f in /tmp/results/*.json; do echo "--- $f"; cat "$f"; echo ""; done
            kill $SERVER_PID 2>/dev/null || true
            echo "M1 NODE 0 PASSED"
          else
            # worker: exit cleanly once master goes away after being healthy
            while curl -sf --max-time 5 http://${MASTER}:30000/health >/dev/null 2>&1; do sleep 15; done
            kill $SERVER_PID 2>/dev/null || true
            echo "M1 NODE 1 PASSED"
          fi
        env:
        - name: HF_HOME
          value: /data/hf
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        - name: SGLANG_NVFP4_CKPT_FP8_GEMM_IN_ATTN
          value: "1"
        - name: SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2
          value: "1"
        - name: UCX_LOG_LEVEL
          value: "info"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: compute-domain-channel
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: sa-bench
          mountPath: /sa-bench
        - name: hf-cache
          mountPath: /data/hf
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 128Gi
      - name: sa-bench
        configMap:
          name: sa-bench-scripts
      - name: hf-cache
        emptyDir: {}
