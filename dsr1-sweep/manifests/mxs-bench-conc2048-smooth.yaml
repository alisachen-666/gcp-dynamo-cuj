# MXS: DIAGNOSTIC (non-record) bench — max_tpt conc-2048 with SMOOTH admission.
# Single change vs mx-bench-conc2048.yaml: measured --request-rate 700 -> 64 (just above the
# achievable ~57-62 req/s), so arrivals stream instead of slamming all 2048 slots at once.
# DELIBERATE METHODOLOGY DEVIATION - never use for parity tables.
# Pre-registered prediction (2026-08-01): if wave-admission is the loss mechanism, prefill
# burst-starve cycles disappear (no >5s gaps), TTFT median collapses to low seconds, and
# completion rate sustains ~64 req/s => out/decode-GPU ~1780+ (capacity proof). If TTFT
# explodes instead, true capacity is below 64 req/s and the gap is genuine server ceiling.
# Run against a standing mx (NATS) deployment.
# M4 bench: WARMUP (rate 250, prompts=conc, per srt-slurm bench.sh convention)
# then MEASURED run at conc 512, req_rate 700 (mid_curve benchmark section).
apiVersion: batch/v1
kind: Job
metadata:
  name: dsr1-mxs-bench-c2048
  namespace: dynamo-cloud
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dsr1-mx-bench
    spec:
      restartPolicy: Never
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: bench
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          FRONTEND=dsr1-mx-frontend.dynamo-cloud.svc.cluster.local
          python3 -c "import aiohttp, numpy, pandas, datasets, PIL, tqdm, transformers" 2>/dev/null \
            || pip install --quiet aiohttp numpy pandas datasets Pillow tqdm transformers
          for i in $(seq 1 120); do
            curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek && break; sleep 10
          done
          curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek || { echo "FRONTEND NOT SERVING"; exit 1; }
          echo "frontend serving"
          cp /sa-bench/*.py /tmp/ && cd /tmp && mkdir -p /tmp/results
          CONC=2048
          echo "===== WARMUP (prompts=3xCONC, rate 250) ====="
          python3 -u benchmark_serving.py \
            --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
            --host ${FRONTEND} --port 8000 \
            --backend dynamo --endpoint /v1/completions \
            --disable-tqdm --dataset-name random \
            --num-prompts $((CONC*3)) \
            --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
            --ignore-eos --request-rate 250 \
            --percentile-metrics ttft,tpot,itl,e2el \
            --max-concurrency ${CONC} --trust-remote-code
          echo "===== MEASURED (prompts=10xCONC, rate 700) ====="
          python3 -u benchmark_serving.py \
            --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
            --host ${FRONTEND} --port 8000 \
            --backend dynamo --endpoint /v1/completions \
            --disable-tqdm --dataset-name random \
            --num-prompts $((CONC*10)) \
            --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
            --ignore-eos --request-rate 64 \
            --percentile-metrics ttft,tpot,itl,e2el \
            --max-concurrency ${CONC} --trust-remote-code \
            --save-result --result-dir /tmp/results \
            --result-filename results_concurrency_${CONC}_gpus_72_ctx_40_gen_32_smooth.json
          echo "--- RESULT JSON"
          cat /tmp/results/results_concurrency_${CONC}_gpus_72_ctx_40_gen_32_smooth.json
          echo ""
          for f in /tmp/results/*.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); print('=== SLIM-RESULT', '$f', json.dumps({k:v for k,v in d.items() if not isinstance(v,list)}))"
          done

          echo "MX MAX_TPT BENCH C2048 PASSED"
        env:
        - name: HF_HOME
          value: /tmp/hf
        resources:
          requests:
            cpu: "16"
            memory: 32Gi
        volumeMounts:
        - name: sa-bench
          mountPath: /sa-bench
      volumes:
      - name: sa-bench
        configMap:
          name: sa-bench-scripts
