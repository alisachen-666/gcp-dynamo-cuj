# CANONICAL UCX / transport env block for ALL disaggregated workers (M2, M4/mid_curve).
# Embed verbatim into prefill AND decode worker containers. Decided 2026-07-29.
#
# !!! rev3 (2026-07-30, learned in M2): UCX_TLS / UCX_NET_DEVICES / UCX_IB_GID_INDEX are
# ONLY usable when the mlx5 NICs are actually inside the pod (mrdma claim on a working-RDMA
# cluster). On REDACTED-GKE-CLUSTER-OLD (no RDMA in pods) they make NIXL's UCX backend creation FAIL HARD
# (nixlBackendError: NIXL_ERR_BACKEND at sglang disagg init) — UCX finds zero allowed net
# devices and aborts instead of falling back to cuda_ipc. srt-slurm/InferenceX sets NO UCX
# restrictions (defaults). => On this cluster use ONLY the flags below; re-add the trio when
# cluster RDMA is fixed AND the mrdma claim is attached.
# Source: teammate's proven GKE values (dynamo-dsr1-fp4-8k1k-mid) + our transport-evidence policy.
#
# UCX_TLS allowlist (rev4, user decision + in-pod testing 2026-07-30):
#   - cuda_ipc + UCX_CUDA_IPC_ENABLE_MNNVL=y -> cross-node NVLink KV transfer (the path we want)
#   - tcp: REQUIRED as UCX active-message/control channel (cuda-only list fails NIXL init);
#     verify via UCX_PROTO_INFO that bulk KV stays on cuda_ipc, tcp carries control only
#   - rc_x: add back only on a working-RDMA cluster together with the mrdma claim
- name: UCX_TLS
  value: "cuda_copy,cuda_ipc,tcp"   # tcp REQUIRED: UCX active-message/control channel.
                                    # cuda-only lists fail: "no active messages transport"
                                    # (tested in-pod 2026-07-30). Bulk KV still cuda_ipc/MNNVL.
- name: UCX_CUDA_IPC_ENABLE_MNNVL
  value: "y"
- name: UCX_MEMTYPE_CACHE
  value: "n"
- name: UCX_MEMTYPE_REG_WHOLE
  value: "n"
- name: UCX_PROTO_INFO
  value: "y"
# --- RDMA-cluster-only trio: re-add ONLY when mlx5 NICs are inside the pod (mrdma claim
# on a fixed-RDMA cluster). On REDACTED-GKE-CLUSTER-OLD today these crash NIXL (see rev3 note above).
# - name: UCX_TLS
#   value: "cuda_copy,cuda_ipc,rc_x"
# - name: UCX_NET_DEVICES
#   value: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1"
# - name: UCX_IB_GID_INDEX
#   value: "5"
# - name: UCX_IB_ROCE_LOCAL_SUBNET   # rail-aware pairing: rails = 8 disjoint /64s with no
#   value: "y"                       # cross-rail routes; same-subnet-only endpoint pairing
# - name: UCX_IB_ROCE_SUBNET_PREFIX_LEN
#   value: "64"
# validation runs only (drop for record runs if log volume costs perf):
- name: UCX_LOG_LEVEL
  value: "info"
