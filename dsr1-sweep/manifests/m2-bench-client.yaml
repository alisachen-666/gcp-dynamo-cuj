# M2 bench client: sa-bench against the dynamo frontend (1P1D), conc 4 + 8, 8k1k.
apiVersion: batch/v1
kind: Job
metadata:
  name: dsr1-m2-bench
  namespace: dynamo-cloud
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dsr1-m2-bench
    spec:
      restartPolicy: Never
      containers:
      - name: bench
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          FRONTEND=dsr1-m2-frontend.dynamo-cloud.svc.cluster.local
          python3 -c "import aiohttp, numpy, pandas, datasets, PIL, tqdm, transformers" 2>/dev/null \
            || pip install --quiet aiohttp numpy pandas datasets Pillow tqdm transformers
          for i in $(seq 1 60); do
            curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek && break; sleep 10
          done
          curl -sf http://${FRONTEND}:8000/v1/models || { echo "FRONTEND NOT SERVING"; exit 1; }
          echo "frontend serving; model registered"
          cp /sa-bench/*.py /tmp/ && cd /tmp && mkdir -p /tmp/results
          for conc in 4 8; do
            python3 -u benchmark_serving.py \
              --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
              --host ${FRONTEND} --port 8000 \
              --backend dynamo --endpoint /v1/completions \
              --disable-tqdm --dataset-name random \
              --num-prompts $((conc * 4)) \
              --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
              --ignore-eos --request-rate inf \
              --percentile-metrics ttft,tpot,itl,e2el \
              --max-concurrency ${conc} --trust-remote-code \
              --save-result --result-dir /tmp/results \
              --result-filename results_concurrency_${conc}_gpus_8_disagg_1p1d.json
          done
          for f in /tmp/results/*.json; do echo "--- $f"; cat "$f"; echo ""; done
          echo "M2 BENCH PASSED"
        env:
        - name: HF_HOME
          value: /tmp/hf
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - name: sa-bench
          mountPath: /sa-bench
      volumes:
      - name: sa-bench
        configMap:
          name: sa-bench-scripts
