# M2: Dynamo 1P1D disaggregated smoke — operator-less (plain Deployments), srt-slurm parity.
# Flags/env: srt-slurm recipes/gb300-fp4/8k1k/low_latency.yaml (1P + 1D subset, TP=4 each).
# Image: exact InferenceX pin + ai-dynamo 0.8.1 wheels installed at start.
# Control plane: chart-installed etcd + NATS in dynamo-cloud (operator parked, RBAC-less).
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsr1-m2-cd
  namespace: dynamo-cloud
spec:
  numNodes: 2
  channel:
    resourceClaimTemplate:
      name: dsr1-m2-cd-channel
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1-m2-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: dsr1-m2-frontend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1-m2-frontend
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsr1-m2-frontend
  template:
    metadata:
      labels:
        app: dsr1-m2-frontend
    spec:
      containers:
      - name: frontend
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          # Mirror the workers' snapshot path with ONLY small files (config/tokenizer):
          # frontend discovery resolves the workers' local model path; weights not needed
          # (dynamo logs `ignore_weights=true`).
          until python3 -c "from huggingface_hub import snapshot_download; snapshot_download('nvidia/DeepSeek-R1-0528-NVFP4-v2', allow_patterns=['*.json','*.py','tokenizer*','*.txt'])"; do
            echo "small-file download failed, retrying in 60s"; sleep 60
          done
          exec python3 -m dynamo.frontend --http-port=8000
        env:
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: HF_HOME
          value: /data/hf
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
        volumeMounts:
        - {name: hf-cache, mountPath: /data/hf}
      volumes:
      - name: hf-cache
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1-m2-prefill
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsr1-m2-prefill
  template:
    metadata:
      labels:
        app: dsr1-m2-prefill
    spec:
      nodeSelector:
        kubernetes.io/hostname: gke-REDACTED-GKE-CLUSTER-OLD-np-2-9d137666-tj0b
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1-m2-cd-channel
      containers:
      - name: prefill
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          # resilient pre-download (dynamo's fetch_llm dies on first 429); resumes shared cache
          until MODEL_DIR=$(python3 -c "from huggingface_hub import snapshot_download; print(snapshot_download('nvidia/DeepSeek-R1-0528-NVFP4-v2'))" 2>/tmp/dl.err); do
            echo "download attempt failed (rate limit?), retrying in 120s"; tail -2 /tmp/dl.err; sleep 120
          done
          echo "model ready at $MODEL_DIR"
          exec python3 -m dynamo.sglang \
            --model-path "$MODEL_DIR" \
            --served-model-name deepseek-ai/DeepSeek-R1 \
            --disaggregation-mode prefill \
            --trust-remote-code \
            --disable-radix-cache \
            --kv-cache-dtype fp8_e4m3 \
            --attention-backend trtllm_mla \
            --quantization modelopt_fp4 \
            --moe-runner-backend flashinfer_trtllm \
            --stream-interval 50 \
            --watchdog-timeout 1000000 \
            --context-length 9600 \
            --mem-fraction-static 0.95 \
            --max-total-tokens 32768 \
            --chunked-prefill-size 24576 \
            --cuda-graph-max-bs 256 \
            --max-running-requests 512 \
            --scheduler-recv-interval 10 \
            --enable-symm-mem \
            --load-balance-method round_robin \
            --disaggregation-bootstrap-port 30001 \
            --data-parallel-size 1 \
            --tensor-parallel-size 4 \
            --expert-parallel-size 1 \
            --fp4-gemm-backend flashinfer_trtllm \
            --disaggregation-transfer-backend nixl \
            --host 0.0.0.0
        env:
        # control plane
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        # model source
        - name: HF_HOME
          value: /data/hf
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        # srt-slurm low_latency prefill_environment
        - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
          value: "1800"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DYN_SKIP_SGLANG_LOG_FORMATTING
          value: "1"
        - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
          value: "0"
        - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
          value: "1"
        - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
          value: "100000"
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: "100000"
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: "100000"
        - name: SGLANG_DECODE_BOOTSTRAP_TIMEOUT
          value: "1000"
        - name: MC_FORCE_MNNVL
          value: "1"
        - name: MC_TE_METRIC
          value: "true"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: "True"
        - name: SGLANG_ENABLE_JIT_DEEPGEMM
          value: "false"
        # canonical UCX / transport-evidence block (manifests/worker-env-canonical.yaml)
        - name: UCX_TLS
          value: "cuda_copy,cuda_ipc,tcp"
        - name: UCX_CUDA_IPC_ENABLE_MNNVL
          value: "y"
        - name: UCX_MEMTYPE_CACHE
          value: "n"
        - name: UCX_MEMTYPE_REG_WHOLE
          value: "n"
        - name: UCX_PROTO_INFO
          value: "y"
        - name: UCX_LOG_LEVEL
          value: "info"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: compute-domain-channel
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: hf-cache, mountPath: /data/hf}
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 128Gi}
      - name: hf-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-hf-cache, type: DirectoryOrCreate}
---
