# DSR1-FP8 LOW-LATENCY — srt-slurm recipes/gb300-fp8/8k1k/stp/low-latency.yaml (verbatim flags).
# 1 prefill worker (1 node, TP=4, EP=1, no dp-attn) + 1 decode worker (1 node, TP=4, EP=1)
# + 10 frontends. 8 GPUs / 2 nodes. Points: conc 4, 8 (req_rate inf).
# Image: InferenceX pin lmsysorg/sglang:v0.5.8.post1-cu130 (NO -runtime suffix) + dynamo 0.8.0.
# Recipe booleans that are `false` are OMITTED, matching srtctl _config_to_cli_args:
#   enable-flashinfer-allreduce-fusion, enable-symm-mem.
# DEVIATION D1: recipe sets SGLANG_DG_CACHE_DIR=/configs/dg-10212025 (a prebuilt DeepGEMM cache on
#   their Slurm FS, not published) + SGLANG_ENABLE_JIT_DEEPGEMM=false. We point the cache at a node
#   hostPath and leave JIT ENABLED on the first bring-up to populate it; flip to "false" for the
#   recorded run once the cache is warm. See PLAN.md.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsr1fp8-ll-cd
  namespace: dynamo-cloud
spec:
  numNodes: 2
  channel:
    resourceClaimTemplate:
      name: dsr1fp8-ll-cd-channel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsr1fp8-deepep-config
  namespace: dynamo-cloud
data:
  deepep_config.json: |
    {
        "normal_dispatch": {
            "num_sms": 128,
            "num_max_nvl_chunked_send_tokens": 28,
            "num_max_nvl_chunked_recv_tokens": 256,
            "num_max_rdma_chunked_send_tokens": 6,
            "num_max_rdma_chunked_recv_tokens": 256
        },
        "normal_combine": {
            "num_sms": 128,
            "num_max_nvl_chunked_send_tokens": 15,
            "num_max_nvl_chunked_recv_tokens": 256,
            "num_max_rdma_chunked_send_tokens": 6,
            "num_max_rdma_chunked_recv_tokens": 128
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1fp8-ll-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: dsr1fp8-ll-frontend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1fp8-ll-frontend
  namespace: dynamo-cloud
spec:
  replicas: 10
  selector:
    matchLabels:
      app: dsr1fp8-ll-frontend
  template:
    metadata:
      labels:
        app: dsr1fp8-ll-frontend
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-2
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: frontend
        image: lmsysorg/sglang:v0.5.8.post1-cu130
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.0" "ai-dynamo==0.8.0"
          # mirror small files to /model — MUST equal the workers' registered model path.
          # skip-tokenizer-init is false here, but the frontend still resolves config/tokenizer.
          until python3 -c "
          from huggingface_hub import snapshot_download
          import shutil, glob, os
          p = snapshot_download('deepseek-ai/DeepSeek-R1-0528', allow_patterns=['*.json','*.py','tokenizer*','*.txt'])
          os.makedirs('/model', exist_ok=True)
          [shutil.copy(f, '/model/') for f in glob.glob(p + '/*') if os.path.isfile(f)]
          "; do echo "small-file mirror failed, retry in 60s"; sleep 60; done
          exec python3 -m dynamo.frontend --http-port=8000
        env:
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: HF_HOME
          value: /tmp/hf
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - {name: model, mountPath: /model}
      volumes:
      - name: model
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1fp8-ll-prefill
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsr1fp8-ll-prefill
  template:
    metadata:
      labels:
        app: dsr1fp8-ll-prefill
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-2
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1fp8-ll-cd-channel
      containers:
      - name: prefill
        image: lmsysorg/sglang:v0.5.8.post1-cu130
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.0" "ai-dynamo==0.8.0"
          [ -f /model/model.safetensors.index.json ] || { echo "MODEL NOT SEEDED on this node"; exit 1; }
          exec python3 -m dynamo.sglang \
            --model-path /model \
            --served-model-name deepseek-ai/DeepSeek-R1 \
            --disaggregation-mode prefill \
            --trust-remote-code \
            --kv-cache-dtype fp8_e4m3 \
            --attention-backend trtllm_mla \
            --quantization fp8 \
            --moe-runner-backend flashinfer_trtllm \
            --fp8-gemm-backend flashinfer_trtllm \
            --disable-radix-cache \
            --stream-interval 10 \
            --watchdog-timeout 1000000 \
            --context-length 9300 \
            --disaggregation-transfer-backend nixl \
            --mem-fraction-static 0.95 \
            --max-total-tokens 32768 \
            --chunked-prefill-size 32768 \
            --max-prefill-tokens 32768 \
            --cuda-graph-max-bs 128 \
            --max-running-requests 128 \
            --load-balance-method round_robin \
            --scheduler-recv-interval 10 \
            --tensor-parallel-size 4 \
            --data-parallel-size 1 \
            --expert-parallel-size 1 \
            --host 0.0.0.0
        env:
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        # srt-slurm low-latency prefill_environment (verbatim)
        - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
          value: "1800"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DYN_SKIP_SGLANG_LOG_FORMATTING
          value: "1"
        - name: SGLANG_DG_CACHE_DIR
          value: "/dg-cache"          # D1: recipe path /configs/dg-10212025 unavailable
        - name: SGLANG_ENABLE_JIT_DEEPGEMM
          value: "true"               # D1: recipe says "false"; flip after cache is warm
        - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
          value: "100000"
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: "100000"
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: "100000"
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: "True"
        - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
          value: "0"
        - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
          value: "1"
        - name: MC_TE_METRIC
          value: "true"
        - name: MC_FORCE_MNNVL
          value: "1"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        # GKE canonical transport block (M2-tested)
        - name: UCX_TLS
          value: "cuda_copy,cuda_ipc,tcp"
        - name: UCX_CUDA_IPC_ENABLE_MNNVL
          value: "y"
        - name: UCX_MEMTYPE_CACHE
          value: "n"
        - name: UCX_MEMTYPE_REG_WHOLE
          value: "n"
        - name: UCX_PROTO_INFO
          value: "y"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: compute-domain-channel
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: model, mountPath: /model, readOnly: true}
        - {name: dg-cache, mountPath: /dg-cache}
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 128Gi}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-fp8-model, type: Directory}
      - name: dg-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-fp8-dg-cache, type: DirectoryOrCreate}
---
apiVersion: apps/v1
kind: Deployment
