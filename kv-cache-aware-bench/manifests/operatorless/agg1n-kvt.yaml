apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k25-agg1n-kvt-config
  namespace: dynamo-cloud
data:
  agg.yaml: |
    backend: pytorch
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    enable_attention_dp: false
    moe_tensor_parallel_size: 4
    moe_expert_parallel_size: 1
    moe_config:
      backend: CUTLASS
    enable_chunked_prefill: true
    max_batch_size: 16
    max_num_tokens: 8192
    max_seq_len: 262144
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.85
      dtype: fp8
      tokens_per_block: 32
      enable_block_reuse: true
    cuda_graph_config:
      enable_padding: true
      batch_sizes: [1, 2, 4, 8, 16]
    print_iter_log: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k25-agg1n-kvt-frontend
  namespace: dynamo-cloud
  labels: {app: kimi-k25-agg1n-kvt-frontend, nvidia.com/dynamo-graph-deployment-name: kimi-k25-agg1n-kvt}
spec:
  strategy: {type: Recreate}
  replicas: 1
  selector: {matchLabels: {app: kimi-k25-agg1n-kvt-frontend}}
  template:
    metadata:
      labels: {app: kimi-k25-agg1n-kvt-frontend, nvidia.com/dynamo-graph-deployment-name: kimi-k25-agg1n-kvt}
      annotations: {gke-gcsfuse/volumes: "true", gke-gcsfuse/memory-limit: 4Gi}
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/gke-nodepool: np-2
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: frontend
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
          command: [python3]
          args:
            - -m
            - dynamo.frontend
            - --router-mode
            - kv
            - --router-prefill-load-scale
            - 2.0
            - --router-queue-policy
            - fcfs
            - --router-temperature
            - 0.0
            - --router-kv-overlap-score-credit
            - 0.7
            - --request-plane
            - nats
          env:
            - {name: ETCD_ENDPOINTS, value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"}
            - {name: NATS_SERVER, value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"}
            - {name: DYN_NAMESPACE, value: "kvbench-agg1n-kvt"}
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache, readOnly: true}
      volumes:
        - {name: model-cache, persistentVolumeClaim: {claimName: model-cache}}
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k25-agg1n-kvt-frontend
  namespace: dynamo-cloud
spec:
  selector: {app: kimi-k25-agg1n-kvt-frontend}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k25-agg1n-kvt-worker
  namespace: dynamo-cloud
  labels: {app: kimi-k25-agg1n-kvt-worker, nvidia.com/dynamo-graph-deployment-name: kimi-k25-agg1n-kvt}
spec:
  strategy: {type: Recreate}
  replicas: 6
  selector: {matchLabels: {app: kimi-k25-agg1n-kvt-worker}}
  template:
    metadata:
      labels: {app: kimi-k25-agg1n-kvt-worker, nvidia.com/dynamo-graph-deployment-name: kimi-k25-agg1n-kvt}
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/memory-limit: 4Gi
        gke-gcsfuse/ephemeral-storage-limit: 1200Gi
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/gke-nodepool: np-2
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: worker
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
          workingDir: /workspace/
          securityContext:
            runAsUser: 0
            capabilities: {add: [IPC_LOCK]}
          command: [python3, -m, dynamo.trtllm]
          args:
            - --model-path
            - /model-cache/alisachen/Kimi-K2.5-NVFP4
            - --served-model-name
            - alisachen/Kimi-K2.5-NVFP4
            - --extra-engine-args
            - /config/agg.yaml
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "32"
            - --dyn-tool-call-parser
            - kimi_k2
            - --dyn-reasoning-parser
            - kimi_k25
          env:
            - {name: ETCD_ENDPOINTS, value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"}
            - {name: NATS_SERVER, value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"}
            - {name: DYN_NAMESPACE, value: "kvbench-agg1n-kvt"}
            - {name: DYN_SYSTEM_PORT, value: "9090"}
            - {name: HF_HOME, value: /model-cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: HF_MODULES_CACHE, value: /tmp/hf_modules}
            - {name: UCX_MEMTYPE_CACHE, value: "0"}
            - {name: UCX_IB_GID_INDEX, value: "5"}
            - {name: UCX_IB_ROCE_LOCAL_SUBNET, value: "1"}
            - {name: UCX_IB_ROCE_SUBNET_PREFIX_LEN, value: "64"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - {name: TLLM_NUMA_AWARE_WORKER_AFFINITY, value: "1"}
            - {name: NCCL_MNNVL_ENABLE, value: "1"}
            - {name: NCCL_CUMEM_ENABLE, value: "1"}
          startupProbe:
            httpGet: {path: /live, port: 9090}
            periodSeconds: 60
            failureThreshold: 240
            timeoutSeconds: 20
          resources:
            limits: {nvidia.com/gpu: "4"}
          envFrom: [{secretRef: {name: hf-token-secret}}]
          volumeMounts:
            - {name: model-cache, mountPath: /model-cache}
            - {name: trtllm-config, mountPath: /config, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: model-cache, persistentVolumeClaim: {claimName: model-cache}}
        - {name: trtllm-config, configMap: {name: kimi-k25-agg1n-kvt-config}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 250Gi}}
