apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k25-disagg-kv-tuned-config
  namespace: dynamo-cloud
data:
  prefill.yaml: "backend: pytorch\nmoe_expert_parallel_size: 4\nmoe_tensor_parallel_size:\
    \ 1\nmoe_config:\n  backend: WIDEEP\ntensor_parallel_size: 4\npipeline_parallel_size:\
    \ 1\nenable_attention_dp: true\n# aic: false (one-shot 137k prefill); we enable\
    \ it because trace p99 input\n# is 252k > max_num_tokens \u2014 tail requests\
    \ need chunking\nenable_chunked_prefill: true\nmax_batch_size: 1\nmax_num_tokens:\
    \ 137504\nmax_seq_len: 262144\ntrust_remote_code: true\nkv_cache_config:\n  free_gpu_memory_fraction:\
    \ 0.8\n  dtype: fp8\n  tokens_per_block: 32\n  enable_block_reuse: true\ncache_transceiver_config:\n\
    \  backend: DEFAULT\n  max_tokens_in_buffer: 138624\ndisable_overlap_scheduler:\
    \ true\nprint_iter_log: false\n"
  decode.yaml: "backend: pytorch\ntensor_parallel_size: 4\npipeline_parallel_size:\
    \ 1\nenable_attention_dp: true\nmoe_tensor_parallel_size: 4\nmoe_expert_parallel_size:\
    \ 1\nmoe_config:\n  backend: WIDEEP\nenable_chunked_prefill: false\n# per-rank\
    \ cap; global 16/worker = headroom over conc32/5 workers\nmax_batch_size: 4\n\
    max_num_tokens: 64\nmax_seq_len: 262144\ntrust_remote_code: true\nkv_cache_config:\n\
    \  free_gpu_memory_fraction: 0.8\n  dtype: fp8\n  tokens_per_block: 32\n  enable_block_reuse:\
    \ true\ncache_transceiver_config:\n  backend: DEFAULT\n  max_tokens_in_buffer:\
    \ 138624\ncuda_graph_config:\n  enable_padding: true\n  batch_sizes:\n  - 1\n\
    \  - 2\n  - 3\n  - 4\n  - 8\nprint_iter_log: false\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k25-disagg-kv-tuned-frontend
  namespace: dynamo-cloud
  labels: &id001
    app: kimi-k25-disagg-kv-tuned-frontend
    nvidia.com/dynamo-graph-deployment-name: kimi-k25-disagg-kv-tuned
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: kimi-k25-disagg-kv-tuned-frontend
  template:
    metadata:
      labels: *id001
      annotations:
        gke-gcsfuse/volumes: 'true'
        gke-gcsfuse/memory-limit: 8Gi
        gke-gcsfuse/ephemeral-storage-limit: 1200Gi
    spec:
      containers:
      - command:
        - python3
        args:
        - -m
        - dynamo.frontend
        - --router-mode
        - kv
        - --router-prefill-load-scale
        - '2.0'
        - --router-queue-policy
        - fcfs
        - --router-temperature
        - '0.0'
        - --router-kv-overlap-score-credit
        - '1.0'
        - --request-plane
        - nats
        env:
        - name: NCCL_MNNVL_ENABLE
          value: '1'
        - name: NCCL_CUMEM_ENABLE
          value: '1'
        - name: TLLM_LOG_LEVEL
          value: info
        - name: TRTLLM_ENABLE_PDL
          value: '1'
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: ETCD_ENDPOINTS
          value: http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379
        - name: NATS_SERVER
          value: nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222
        - name: DYN_NAMESPACE
          value: kvbench-disagg-kv-tuned
        image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
        name: frontend
        resources: {}
        volumeMounts:
        - name: model-cache
          mountPath: /model-cache
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/gke-nodepool: np-1
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: kimi-k25-disagg-kv-tuned-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: kimi-k25-disagg-kv-tuned-frontend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k25-disagg-kv-tuned-prefill
  namespace: dynamo-cloud
  labels: &id001
    app: kimi-k25-disagg-kv-tuned-prefill
    nvidia.com/dynamo-graph-deployment-name: kimi-k25-disagg-kv-tuned
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: kimi-k25-disagg-kv-tuned-prefill
  template:
    metadata:
      labels: *id001
      annotations:
        gke-gcsfuse/volumes: 'true'
        gke-gcsfuse/memory-limit: 8Gi
        gke-gcsfuse/ephemeral-storage-limit: 1200Gi
    spec:
      containers:
      - args:
        - --model-path
        - /model-cache/alisachen/Kimi-K2.5-NVFP4
        - --served-model-name
        - alisachen/Kimi-K2.5-NVFP4
        - --extra-engine-args
        - /config/prefill.yaml
        - --disaggregation-mode
        - prefill
        - --publish-events-and-metrics
        - --request-plane
        - nats
        - --kv-block-size
        - '32'
        - --dyn-tool-call-parser
        - kimi_k2
        - --dyn-reasoning-parser
        - kimi_k25
        command:
        - python3
        - -m
        - dynamo.trtllm
        env:
        - name: NCCL_MNNVL_ENABLE
          value: '1'
        - name: NCCL_CUMEM_ENABLE
          value: '1'
        - name: TLLM_LOG_LEVEL
          value: info
        - name: TRTLLM_ENABLE_PDL
          value: '1'
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: HF_MODULES_CACHE
          value: /tmp/hf_modules
        - name: NCCL_GRAPH_MIXING_SUPPORT
          value: '0'
        - name: TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER
          value: '1'
        - name: TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE
          value: 0B
        - name: ETCD_ENDPOINTS
          value: http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379
        - name: NATS_SERVER
          value: nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222
        - name: DYN_NAMESPACE
          value: kvbench-disagg-kv-tuned
        - name: DYN_SYSTEM_PORT
          value: '9090'
        - name: UCX_MEMTYPE_CACHE
          value: '0'
        - name: UCX_IB_GID_INDEX
          value: '5'
        - name: UCX_IB_ROCE_LOCAL_SUBNET
          value: '1'
        - name: UCX_IB_ROCE_SUBNET_PREFIX_LEN
          value: '64'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: TLLM_NUMA_AWARE_WORKER_AFFINITY
          value: '1'
        image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
        name: prefill
        resources:
          limits:
            nvidia.com/gpu: '4'
          claims:
          - name: compute-domain-channel
          - name: rdma
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - IPC_LOCK
        startupProbe:
          failureThreshold: 240
          httpGet:
            path: /live
            port: 9090
          periodSeconds: 60
          timeoutSeconds: 20
        volumeMounts:
        - mountPath: /model-cache
          name: model-cache
        - mountPath: /config
          name: trtllm-config
          readOnly: true
        - name: shm
          mountPath: /dev/shm
        workingDir: /workspace/
        envFrom:
        - secretRef:
            name: hf-token-secret
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/gke-nodepool: np-1
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: trtllm-config
        configMap:
          name: kimi-k25-disagg-kv-tuned-config
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 250Gi
      resourceClaims:
      - name: compute-domain-channel
        resourceClaimTemplateName: kv-bench-compute-domain-channel
      - name: rdma
        resourceClaimTemplateName: mrdma-all
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimi-k25-disagg-kv-tuned-decode
  namespace: dynamo-cloud
  labels: &id001
