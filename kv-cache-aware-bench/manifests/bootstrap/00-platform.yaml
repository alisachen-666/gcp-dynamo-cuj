apiVersion: v1
kind: Namespace
metadata:
  name: dynamo-cloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-platform-etcd
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector: {matchLabels: {app: dynamo-platform-etcd}}
  template:
    metadata: {labels: {app: dynamo-platform-etcd}}
    spec:
      nodeSelector: {cloud.google.com/gke-nodepool: system}
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.15
        command: ["etcd","--advertise-client-urls","http://0.0.0.0:2379","--listen-client-urls","http://0.0.0.0:2379"]
        ports: [{containerPort: 2379}]
---
apiVersion: v1
kind: Service
metadata: {name: dynamo-platform-etcd, namespace: dynamo-cloud}
spec:
  selector: {app: dynamo-platform-etcd}
  ports: [{port: 2379, targetPort: 2379}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: nats-config, namespace: dynamo-cloud}
data:
  nats.conf: |
    port: 4222
    max_payload: 16777216
    jetstream {
      store_dir: /data
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-platform-nats
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector: {matchLabels: {app: dynamo-platform-nats}}
  template:
    metadata: {labels: {app: dynamo-platform-nats}}
    spec:
      nodeSelector: {cloud.google.com/gke-nodepool: system}
      containers:
      - name: nats
        image: nats:2.10-alpine
        args: ["-c","/etc/nats/nats.conf"]
        ports: [{containerPort: 4222}]
        volumeMounts:
        - {name: config, mountPath: /etc/nats}
        - {name: data, mountPath: /data}
      volumes:
      - {name: config, configMap: {name: nats-config}}
      - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: dynamo-platform-nats, namespace: dynamo-cloud}
spec:
  selector: {app: dynamo-platform-nats}
  ports: [{port: 4222, targetPort: 4222}]
