#
# Disaggregated Kimi-K2.5-NVFP4 with KV-aware routing.
#
# Topology (6x GB200 nodes, 24 GPUs total):
#   - 3x prefill workers (TP=4 / EP=4, single-node each)
#   - 3x decode workers  (TP=4 / EP=4, single-node each)
#
# Routing: frontend uses KV-aware routing with prefix-hash awareness to land
# requests on whichever prefill worker already holds matching KV blocks.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: kimi-k25-disagg-rr
spec:
  envs:
    - name: NCCL_MNNVL_ENABLE
      value: "1"
    - name: NCCL_CUMEM_ENABLE
      value: "1"
    - name: TLLM_LOG_LEVEL
      value: "info"
    - name: TRTLLM_ENABLE_PDL
      value: "1"
  services:
    Frontend:
      componentType: frontend
      extraPodSpec:
        containers: null
        mainContainer:
          command:
            - python3
          args:
            - -m
            - dynamo.frontend
            - --router-mode
            - round-robin
            - --request-plane
            - nats
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
          name: ""
          resources: {}
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
      replicas: 1

    prefill:
      componentType: worker
      subComponentType: prefill
      envFromSecret: hf-token-secret
      extraPodSpec:
        containers: null
        mainContainer:
          args:
            - --model-path
            - /model-cache/alisachen/Kimi-K2.5-NVFP4
            - --served-model-name
            - alisachen/Kimi-K2.5-NVFP4
            - --extra-engine-args
            - /config/prefill.yaml
            - --disaggregation-mode
            - prefill
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "32"
            - --dyn-tool-call-parser
            - kimi_k2
            - --dyn-reasoning-parser
            - kimi_k25
          command:
            - python3
            - -m
            - dynamo.trtllm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /model-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            # KV transfer (UCX zcopy on; no staging buffer required)
            - name: TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER
              value: "1"
            - name: TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE
              value: "0B"
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
          name: ""
          resources: {}
          securityContext:
            runAsUser: 0
          startupProbe:
            failureThreshold: 240
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /config
              name: trtllm-config
              readOnly: true
          workingDir: /workspace/
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: kv-bench-compute-domain-channel
          - name: rdma
            resourceClaimTemplateName: mrdma-all
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: trtllm-config
            configMap:
              name: kimi-k25-disagg-rr-config
      replicas: 1
      resources:
        limits:
          gpu: "4"
        claims:
          - name: compute-domain-channel
          - name: rdma

    decode:
      componentType: worker
      subComponentType: decode
      envFromSecret: hf-token-secret
      extraPodSpec:
        containers: null
        mainContainer:
          args:
            - --model-path
            - /model-cache/alisachen/Kimi-K2.5-NVFP4
            - --served-model-name
            - alisachen/Kimi-K2.5-NVFP4
            - --extra-engine-args
            - /config/decode.yaml
            - --disaggregation-mode
            - decode
            - --publish-events-and-metrics
            - --request-plane
            - nats
            - --kv-block-size
            - "32"
            - --dyn-tool-call-parser
            - kimi_k2
            - --dyn-reasoning-parser
            - kimi_k25
          command:
            - python3
            - -m
            - dynamo.trtllm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /model-cache
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRITON_CACHE_DIR
              value: /tmp/.triton-cache
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: NCCL_GRAPH_MIXING_SUPPORT
              value: "0"
            - name: ENABLE_CONFIGURABLE_MOE
              value: "1"
            # Uncomment the below to reproduce benchmark results in README exactly.
            # - name: TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS
            #   value: "2"
            # KV transfer (UCX zcopy on; no staging buffer required)
            - name: TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER
              value: "1"
            - name: TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE
              value: "0B"
            - name: NCCL_NVLS_ENABLE
              value: "1"
            - name: NVIDIA_GDRCOPY
              value: "1"
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
          name: ""
          resources: {}
          securityContext:
            runAsUser: 0
          startupProbe:
            failureThreshold: 240
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 60
            timeoutSeconds: 20
          volumeMounts:
            - mountPath: /model-cache
              name: model-cache
            - mountPath: /config
              name: trtllm-config
              readOnly: true
          workingDir: /workspace/
        nodeSelector:
          kubernetes.io/arch: arm64
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
          - key: kubernetes.io/arch
            operator: Equal
            value: arm64
            effect: NoSchedule
        resourceClaims:
          - name: compute-domain-channel
            resourceClaimTemplateName: kv-bench-compute-domain-channel
          - name: rdma
            resourceClaimTemplateName: mrdma-all
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: model-cache
          - name: trtllm-config
            configMap:
              name: kimi-k25-disagg-rr-config
      replicas: 5
      resources:
        limits:
          gpu: "4"
        claims:
          - name: compute-domain-channel
          - name: rdma
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k25-disagg-rr-config
data:
  prefill.yaml: |
    backend: pytorch
    moe_expert_parallel_size: 4
    moe_tensor_parallel_size: 1
    moe_config:
      backend: WIDEEP
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    enable_attention_dp: true
    # aic: false (one-shot 137k prefill); we enable it because trace p99 input
    # is 252k > max_num_tokens — tail requests need chunking
    enable_chunked_prefill: true
    max_batch_size: 1
    max_num_tokens: 137504
    max_seq_len: 262144
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.8
      dtype: fp8
      tokens_per_block: 32
      enable_block_reuse: true
    cache_transceiver_config:
      backend: DEFAULT
      max_tokens_in_buffer: 138624
    disable_overlap_scheduler: true
    print_iter_log: false
  decode.yaml: |
    backend: pytorch
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    enable_attention_dp: true
    moe_tensor_parallel_size: 4
    moe_expert_parallel_size: 1
    moe_config:
      backend: WIDEEP
    enable_chunked_prefill: false
    # per-rank cap; global 16/worker = headroom over conc32/5 workers
    max_batch_size: 4
    max_num_tokens: 64
    max_seq_len: 262144
    trust_remote_code: true
    kv_cache_config:
      free_gpu_memory_fraction: 0.8
      dtype: fp8
      tokens_per_block: 32
      enable_block_reuse: true
    cache_transceiver_config:
      backend: DEFAULT
      max_tokens_in_buffer: 138624
    cuda_graph_config:
      enable_padding: true
      batch_sizes:
      - 1
      - 2
      - 3
      - 4
      - 8
    print_iter_log: false
