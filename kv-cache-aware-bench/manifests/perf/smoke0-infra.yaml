# S0 infra smoke: validates everything except the model itself, in ~5 min.
#   - runtime image pulls + runs on an arm64 GB300 node (dynamo + trtllm import)
#   - etcd/NATS reachable from a GPU node
#   - model-cache PVC (gcsfuse) mounts, is writable, and traces are present
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke0-infra
  namespace: dynamo-cloud
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: smoke0-infra
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      containers:
        - name: smoke
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
          command: ["bash", "-c"]
          args:
            - |
              set -eux
              echo "== [1/5] runtime imports =="
              python3 - <<'EOF'
              import dynamo, tensorrt_llm, torch
              print("dynamo OK; trtllm", tensorrt_llm.__version__, "; cuda avail:", torch.cuda.is_available(), torch.cuda.device_count(), "GPUs")
              EOF
              echo "== [2/5] etcd reachability =="
              python3 -c "import socket; socket.create_connection(('dynamo-platform-etcd.dynamo-cloud.svc.cluster.local', 2379), timeout=10); print('etcd OK')"
              echo "== [3/5] NATS reachability =="
              python3 -c "import socket; socket.create_connection(('dynamo-platform-nats.dynamo-cloud.svc.cluster.local', 4222), timeout=10); print('nats OK')"
              echo "== [4/5] model-cache PVC write/read =="
              echo smoke-$(date +%s) > /model-cache/.smoke0 && cat /model-cache/.smoke0 && rm /model-cache/.smoke0
              echo "== [5/5] traces present =="
              wc -l /model-cache/traces/weka_256k_aiperf.jsonl /model-cache/traces/smoke_tiny.jsonl /model-cache/traces/smoke_short.jsonl
              echo "S0 PASS"
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
