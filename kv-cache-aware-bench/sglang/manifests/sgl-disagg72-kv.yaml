apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgl-disagg72-kv-frontend
  namespace: dynamo-cloud
  labels:
    app: sgl-disagg72-kv-frontend
    nvidia.com/dynamo-graph-deployment-name: sgl-disagg72-kv
spec:
  strategy:
    type: Recreate
  progressDeadlineSeconds: 3600
  replicas: 1
  selector:
    matchLabels:
      app: sgl-disagg72-kv-frontend
  template:
    metadata:
      labels:
        app: sgl-disagg72-kv-frontend
        nvidia.com/dynamo-graph-deployment-name: sgl-disagg72-kv
      annotations:
        gke-gcsfuse/volumes: 'true'
        gke-gcsfuse/memory-limit: 8Gi
        gke-gcsfuse/ephemeral-storage-limit: 1200Gi
    spec:
      containers:
      - name: frontend
        image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.3.1
        command:
        - python3
        args:
        - -m
        - dynamo.frontend
        - --router-mode
        - kv
        - --router-temperature
        - '0.0'
        - --router-queue-policy
        - fcfs
        - --request-plane
        - nats
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: ETCD_ENDPOINTS
          value: http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379
        - name: NATS_SERVER
          value: nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222
        - name: DYN_NAMESPACE
          value: sgl-disagg72-kv
        resources: {}
        volumeMounts:
        - mountPath: /model-cache
          name: model-cache
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/gke-nodepool: np-1
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: sgl-disagg72-kv-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: sgl-disagg72-kv-frontend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sgl-disagg72-kv-prefill
  namespace: dynamo-cloud
  labels:
    app: sgl-disagg72-kv-prefill
    nvidia.com/dynamo-graph-deployment-name: sgl-disagg72-kv
spec:
  strategy:
    type: Recreate
  progressDeadlineSeconds: 3600
  replicas: 6
  selector:
    matchLabels:
      app: sgl-disagg72-kv-prefill
  template:
    metadata:
      labels:
        app: sgl-disagg72-kv-prefill
        nvidia.com/dynamo-graph-deployment-name: sgl-disagg72-kv
      annotations:
        gke-gcsfuse/volumes: 'true'
        gke-gcsfuse/memory-limit: 8Gi
        gke-gcsfuse/ephemeral-storage-limit: 1200Gi
    spec:
      containers:
      - name: prefill
        image: lmsysorg/sglang:v0.5.14-cu130-runtime
        command:
        - bash
        - -c
        args:
        - pip install -q "ai-dynamo[sglang]==1.3.1" && python3 -c "import sglang,dynamo;print('sglang',sglang.__version__)"
          && exec python3 -m dynamo.sglang --model-path /model-cache/alisachen/Kimi-K2.5-NVFP4
          --served-model-name alisachen/Kimi-K2.5-NVFP4 --skip-tokenizer-init --tp-size
          4 --ep-size 4 --quantization modelopt_fp4 --request-plane nats --host 0.0.0.0
          --trust-remote-code --mem-fraction-static 0.85 --context-length 262144 --page-size
          64 --watchdog-timeout 1000000 --kv-events-config {"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558"}
          --disaggregation-mode prefill --disaggregation-transfer-backend nixl --disaggregation-bootstrap-port
          30001 --chunked-prefill-size 16384 --max-running-requests 8
        env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: ETCD_ENDPOINTS
          value: http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379
        - name: NATS_SERVER
          value: nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222
        - name: DYN_NAMESPACE
          value: sgl-disagg72-kv
        - name: UCX_TLS
          value: cuda_copy,rc_x,tcp
        - name: UCX_NET_DEVICES
          value: mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1
        - name: UCX_MEMTYPE_CACHE
          value: 'n'
        - name: UCX_MEMTYPE_REG_WHOLE
          value: 'n'
        - name: UCX_CUDA_IPC_ENABLE_MNNVL
          value: 'y'
        - name: UCX_IB_GID_INDEX
          value: '5'
        - name: UCX_IB_ROCE_LOCAL_SUBNET
          value: 'y'
        - name: UCX_IB_ROCE_SUBNET_PREFIX_LEN
          value: '64'
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: '100000'
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: '100000'
        - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
          value: '100000'
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: 'True'
        - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
          value: '1'
        - name: SGLANG_NVFP4_CKPT_FP8_GEMM_IN_ATTN
          value: '1'
        - name: SGLANG_PER_TOKEN_GROUP_QUANT_8BIT_V2
          value: '1'
        - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
          value: '0'
        - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
          value: '1800'
        - name: TP_SOCKET_IFNAME
          value: eth0
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: DYN_SKIP_SGLANG_LOG_FORMATTING
          value: '1'
        - name: UCX_PROTO_INFO
          value: 'y'
        - name: NCCL_DEBUG
          value: VERSION
        - name: DYN_SYSTEM_PORT
          value: '9090'
        - name: HF_HOME
          value: /model-cache
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: HF_MODULES_CACHE
          value: /tmp/hf_modules
        - name: NCCL_MNNVL_ENABLE
          value: '0'
        - name: NCCL_CUMEM_ENABLE
          value: '1'
        - name: NCCL_SOCKET_IFNAME
          value: eth0
        - name: GLOO_SOCKET_IFNAME
          value: eth0
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: SGLANG_DISABLE_REQUEST_LOGGING
          value: '1'
        resources:
          limits:
            nvidia.com/gpu: '4'
          claims:
          - name: rdma
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - IPC_LOCK
        startupProbe:
          failureThreshold: 240
          httpGet:
            path: /live
            port: 9090
          periodSeconds: 60
          timeoutSeconds: 20
        volumeMounts:
        - mountPath: /model-cache
          name: model-cache
          readOnly: true
        - mountPath: /dev/shm
          name: shm
      nodeSelector:
        kubernetes.io/arch: arm64
        cloud.google.com/gke-nodepool: np-1
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
      volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 250Gi
      resourceClaims:
      - name: rdma
        resourceClaimTemplateName: mrdma-all
---
