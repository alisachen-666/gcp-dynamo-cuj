# DSV4-P5R: RDMA-KV sweep arm — identical to p5.yaml except mooncake KV rides GPUDirect
# RDMA (MC_FORCE_MNNVL=0, 8x mrdma DRA claims/worker, MC_GID_INDEX=5 defensive). Diagnostic
# transport A/B; MNNVL results remain the recipe-parity record.
# DSv4 p5: generated from recipe (see reference/). prefill 2w DEP4 x2n, decode DEP8 x2n.
# 1 prefill (DEP4, 1 node) + 1 decode (DEP8, 2 nodes) + 9 frontends. 3 nodes / 12 GPUs.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsv4-p5r-cd
  namespace: dynamo-cloud
spec:
  numNodes: 4
  channel:
    resourceClaimTemplate:
      name: dsv4-p5r-cd-channel
---
apiVersion: v1
kind: Service
metadata:
  name: dsv4-p5r-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: dsv4-p5r-frontend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv4-p5r-frontend
  namespace: dynamo-cloud
spec:
  replicas: 9
  selector:
    matchLabels:
      app: dsv4-p5r-frontend
  template:
    metadata:
      labels:
        app: dsv4-p5r-frontend
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: frontend
        image: lmsysorg/sglang:nightly-dev-20260601-373cadc9
        command: ["bash", "-c"]
        args:
        - |
          set -e
          mkdir -p /opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu
          ln -sf /usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/*.so* /opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/ 2>/dev/null || true
          pip install --quiet /wheels/*.whl
          exec python3 -m dynamo.frontend --http-port=8000
        env:
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: DYN_REQUEST_PLANE
          value: "nats"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
        volumeMounts:
        - {name: wheels, mountPath: /wheels, readOnly: true}
        - {name: model, mountPath: /model, readOnly: true}
      volumes:
      - name: wheels
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-wheels, type: Directory}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-model, type: Directory}
      - name: jit-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-jit-cache, type: DirectoryOrCreate}
      - name: dg-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-dg-cache, type: DirectoryOrCreate}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv4-p5r-prefill
  namespace: dynamo-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dsv4-p5r-prefill
  template:
    metadata:
      labels:
        app: dsv4-p5r-prefill
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: rdma
        resourceClaimTemplateName: mrdma-all
      - name: compute-domain-channel
        resourceClaimTemplateName: dsv4-p5r-cd-channel
      initContainers:
      # NCCL gIB plugin (GPUDirect RoCE transport for NCCL) — raw-manifest port of
      # gpu-recipes network.gibInstall method=apt. Stages /usr/local/gib for the worker.
      - name: nccl-gib-apt-installer
        image: lmsysorg/sglang:nightly-dev-20260601-373cadc9
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /etc/apt/trusted.gpg.d/cloud.google.gpg
          echo 'deb https://packages.cloud.google.com/apt gpudirect-gib-apt main' > /etc/apt/sources.list.d/nccl-gib.list
          apt-get update
          apt-get install -y --no-install-recommends nccl-gib
          test -f /usr/local/gib/scripts/set_nccl_env.sh
          mkdir -p /target/usr/local/gib
          cp -a /usr/local/gib/. /target/usr/local/gib/
        volumeMounts:
        - {name: gib, mountPath: /target/usr/local/gib}
      containers:
      - name: prefill
        image: lmsysorg/sglang:nightly-dev-20260601-373cadc9
        command: ["bash", "-c"]
        args:
        - |
          set -e
          mkdir -p /opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu
          ln -sf /usr/local/lib/python3.12/dist-packages/.nixl_cu13.mesonpy.libs/*.so* /opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/ 2>/dev/null || true
          pip install --quiet /wheels/*.whl
          [ -f /model/model.safetensors.index.json ] || { echo "DSV4 MODEL NOT SEEDED"; exit 1; }
          exec python3 -m dynamo.sglang \
            --model-path /model/ \
            --served-model-name deepseek-ai/DeepSeek-V4-Pro \
            --trust-remote-code \
            --tool-call-parser deepseekv4 \
            --disaggregation-mode prefill \
            --disaggregation-transfer-backend mooncake \
            --tensor-parallel-size 4 \
            --data-parallel-size 4 \
            --expert-parallel-size 4 \
            --enable-dp-attention \
            --enable-dp-lm-head \
            --moe-a2a-backend megamoe \
            --mem-fraction-static 0.9 \
            --max-running-requests 512 \
            --cuda-graph-max-bs 512 \
            --chunked-prefill-size 32768 \
            --stream-interval 60 \
            --disaggregation-bootstrap-port 30001 \
            --host 0.0.0.0
        env:
        - name: LD_LIBRARY_PATH
          value: "/usr/local/gib/lib64:/usr/local/ucx/lib:/usr/local/ucx/lib/ucx:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/plugins:/usr/local/nvidia/lib64"
        - name: NCCL_DEBUG
          value: "VERSION"
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: DYN_REQUEST_PLANE
          value: "nats"
        # recipe prefill_environment (verbatim)
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: SGLANG_RADIX_DISABLE_REUSE
          value: "1"
        - name: SGLANG_JIT_DEEPGEMM_FAST_WARMUP
          value: "1"
        - name: SGLANG_DEFAULT_THINKING
          value: "1"
        - name: SGLANG_DSV4_REASONING_EFFORT
          value: "max"
        - name: SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT
          value: "1"
        - name: SGLANG_OPT_SWA_EVICT_DROP_PAGE_MARGIN
          value: "1"
        - name: SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2
          value: "1"
        - name: SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_FP4_ACTS
          value: "1"
        - name: SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_MXF4_KIND
          value: "1"
        - name: SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK
          value: "9216"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: "True"
        - name: MC_FORCE_MNNVL
          value: "0"
        - name: MC_GID_INDEX
          value: "5"
        - name: MC_TE_METRIC
          value: "true"
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: "100000"
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: "100000"
        - name: SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW
          value: "1"
        # GKE canonical transport-evidence block
        - name: UCX_TLS
          value: "cuda_copy,cuda_ipc,tcp"
        - name: UCX_CUDA_IPC_ENABLE_MNNVL
          value: "y"
        - name: UCX_MEMTYPE_CACHE
          value: "n"
        - name: UCX_MEMTYPE_REG_WHOLE
          value: "n"
        - name: UCX_PROTO_INFO
          value: "y"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: rdma
          - name: compute-domain-channel
        volumeMounts:
        - {name: gib, mountPath: /usr/local/gib, readOnly: true}
        - {name: dshm, mountPath: /dev/shm}
        - {name: wheels, mountPath: /wheels, readOnly: true}
        - {name: model, mountPath: /model, readOnly: true}
        - {name: jit-cache, mountPath: /root/.cache/flashinfer}
        - {name: dg-cache, mountPath: /root/.cache/deep_gemm}
      volumes:
      - {name: gib, emptyDir: {}}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 128Gi}
      - name: wheels
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-wheels, type: Directory}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-model, type: Directory}
      - name: jit-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-jit-cache, type: DirectoryOrCreate}
      - name: dg-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-dg-cache, type: DirectoryOrCreate}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsv4-p5r-decode
  namespace: dynamo-cloud
spec:
  serviceName: dsv4-p5r-decode
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: dsv4-p5r-decode
  template:
    metadata:
      labels:
        app: dsv4-p5r-decode
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: rdma
        resourceClaimTemplateName: mrdma-all
      - name: compute-domain-channel
        resourceClaimTemplateName: dsv4-p5r-cd-channel
      initContainers:
      # NCCL gIB plugin (GPUDirect RoCE transport for NCCL) — raw-manifest port of
