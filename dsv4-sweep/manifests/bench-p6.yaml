# DSv4 bench template: chat-template + custom DSv4 tokenizer, per recipe benchmark section.
# Methodology: warmup 3x conc @ rate 250, long-run warm (extra 5x pass, discarded),
# measured 10x conc @ recipe req_rate (inf for dsv4 points).
apiVersion: batch/v1
kind: Job
metadata:
  name: dsv4-bench-p6
  namespace: dynamo-cloud
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dsv4-bench
    spec:
      restartPolicy: Never
      nodeSelector: {cloud.google.com/gke-nodepool: np-3}
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: bench
        image: lmsysorg/sglang:nightly-dev-20260601-373cadc9
        command: ["bash", "-c"]
        args:
        - |
          set -e
          FRONTEND=dsv4-p6-frontend.dynamo-cloud.svc.cluster.local
          python3 -c "import aiohttp, numpy, pandas, datasets, PIL, tqdm, transformers" 2>/dev/null \
            || pip install --quiet aiohttp numpy pandas datasets Pillow tqdm transformers
          for i in $(seq 1 90); do curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek && break; sleep 10; done
          curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek || { echo "FRONTEND NOT SERVING"; exit 1; }
          cp -L /sa-bench/*.py /tmp/ && mkdir -p /tmp/sa_bench_tokenizers && cp -L /sa-bench-tok/* /tmp/sa_bench_tokenizers/ && cd /tmp && mkdir -p /tmp/results && ls /tmp/benchmark_serving.py
          run_bench() {  # conc num_prompts rate save
            local C=$1 N=$2 R=$3 SAVE=$4
            python3 -u benchmark_serving.py \
              --model deepseek-ai/DeepSeek-V4-Pro --tokenizer /model \
              --host ${FRONTEND} --port 8000 \
              --backend dynamo --endpoint /v1/completions \
              --disable-tqdm --dataset-name random \
              --num-prompts $N \
              --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
              --ignore-eos --request-rate $R \
              --percentile-metrics ttft,tpot,itl,e2el \
              --max-concurrency $C --trust-remote-code \
              --use-chat-template \
              --custom-tokenizer sa_bench_tokenizers.sglang_deepseek_v4.SGLangDeepseekV4Tokenizer \
              $SAVE
          }
          for CONC in 1024; do
            echo "===== conc $CONC WARMUP (3x @250) ====="
            run_bench $CONC $((CONC*3)) 250 ""
            echo "===== conc $CONC LONG-RUN WARM (5x @inf, discarded) ====="
            run_bench $CONC $((CONC*5)) inf ""
            echo "===== conc $CONC MEASURED (10x @inf) ====="
            run_bench $CONC $((CONC*10)) inf "--save-result --result-dir /tmp/results --result-filename results_concurrency_${CONC}_gpus_24_ctx_16_gen_8.json"
          done
          for f in /tmp/results/*.json; do echo "--- $f"; cat "$f"; echo ""; done
          for f in /tmp/results/*.json; do
            python3 -c "import json; d=json.load(open('$f')); print('=== SLIM-RESULT', '$f', json.dumps({k:v for k,v in d.items() if not isinstance(v,list)}))"
          done

          echo "DSV4 BENCH p6 PASSED"
        env:
        - name: HF_HOME
          value: /tmp/hf
        resources:
          requests: {cpu: "16", memory: 32Gi}
        volumeMounts:
        - {name: sa-bench, mountPath: /sa-bench}
        - {name: sa-bench-tok, mountPath: /sa-bench-tok}
        - {name: model, mountPath: /model, readOnly: true}
      volumes:
      - name: sa-bench
        configMap: {name: sa-bench-scripts}
      - name: sa-bench-tok
        configMap: {name: sa-bench-tokenizers}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsv4-model, type: Directory}
