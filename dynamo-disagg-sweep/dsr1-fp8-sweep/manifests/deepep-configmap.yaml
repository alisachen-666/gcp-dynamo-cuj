# DeepEP tuning config, verbatim from srt-slurm configs/deepep_config.json
# (branch sa-submission-q2-2026 @ deb1dfd9; copy in ../reference/deepep_config.json).
# Mounted at /configs on every mid/max worker; referenced by --deepep-config.
# Apply ONCE before mid or max: kubectl apply -f manifests/deepep-configmap.yaml
# Not needed by the low-latency config (no DeepEP: plain TP4, no moe-a2a-backend).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsr1fp8-deepep-config
  namespace: dynamo-cloud
data:
  deepep_config.json: |
    {
        "normal_dispatch": {
            "num_sms": 128,
            "num_max_nvl_chunked_send_tokens": 28,
            "num_max_nvl_chunked_recv_tokens": 256,
            "num_max_rdma_chunked_send_tokens": 6,
            "num_max_rdma_chunked_recv_tokens": 256
        },
        "normal_combine": {
            "num_sms": 128,
            "num_max_nvl_chunked_send_tokens": 15,
            "num_max_nvl_chunked_recv_tokens": 256,
            "num_max_rdma_chunked_send_tokens": 6,
            "num_max_rdma_chunked_recv_tokens": 128
        }
    }
