apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsr1fp8-max-prefill-0
  namespace: dynamo-cloud
spec:
  serviceName: dsr1fp8-max-prefill-0
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: dsr1fp8-max-prefill-0
  template:
    metadata:
      labels:
        app: dsr1fp8-max-prefill-0
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-2
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1fp8-max-cd-channel
      containers:
      - name: prefill
        image: lmsysorg/sglang:v0.5.8.post1-cu130
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.0" "ai-dynamo==0.8.0"
          [ -f /model/model.safetensors.index.json ] || { echo "MODEL NOT SEEDED on this node"; exit 1; }
          exec python3 -m dynamo.sglang \
            --model-path /model \
            --served-model-name deepseek-ai/DeepSeek-R1 \
            --disaggregation-mode prefill \
            --skip-tokenizer-init \
            --trust-remote-code \
            --tensor-parallel-size 8 \
            --data-parallel-size 8 \
            --expert-parallel-size 8 \
            --enable-dp-attention \
            --attention-backend trtllm_mla \
            --kv-cache-dtype fp8_e4m3 \
            --disable-radix-cache \
            --stream-interval 50 \
            --max-running-requests 30000 \
            --context-length 9300 \
            --watchdog-timeout 1000000 \
            --disable-shared-experts-fusion \
            --eplb-algorithm deepseek \
            --disaggregation-bootstrap-port 30001 \
            --disaggregation-transfer-backend nixl \
            --mem-fraction-static 0.75 \
            --max-total-tokens 524288 \
            --chunked-prefill-size 131072 \
            --load-balance-method round_robin \
            --disable-cuda-graph \
            --moe-a2a-backend deepep \
            --deepep-mode normal \
            --ep-dispatch-algorithm dynamic \
            --moe-dense-tp-size 1 \
            --enable-dp-lm-head \
            --ep-num-redundant-experts 32 \
            --deepep-config /configs/deepep_config.json \
            --dist-init-addr dsr1fp8-max-prefill-0-0.dsr1fp8-max-prefill-0.dynamo-cloud.svc.cluster.local:5757 \
            --nnodes 2 \
            --node-rank $POD_INDEX \
            --host 0.0.0.0
        env:
        - name: POD_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
          value: "1800"
        - name: SGLANG_DG_CACHE_DIR
          value: "/dg-cache"
        - name: DYN_SKIP_SGLANG_LOG_FORMATTING
          value: "1"
        - name: MC_TE_METRIC
          value: "true"
        - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
          value: "100000"
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: "100000"
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: "100000"
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: "True"
        - name: MC_FORCE_MNNVL
          value: "1"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
          value: "0"
        - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: UCX_TLS
          value: "cuda_copy,cuda_ipc,tcp"
        - name: UCX_CUDA_IPC_ENABLE_MNNVL
          value: "y"
        - name: UCX_MEMTYPE_CACHE
          value: "n"
        - name: UCX_MEMTYPE_REG_WHOLE
          value: "n"
        - name: UCX_PROTO_INFO
          value: "y"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: compute-domain-channel
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: model, mountPath: /model, readOnly: true}
        - {name: dg-cache, mountPath: /dg-cache}
        - {name: configs, mountPath: /configs}
      volumes:
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 128Gi}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-fp8-model, type: Directory}
      - name: dg-cache
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-fp8-dg-cache, type: DirectoryOrCreate}
      - name: configs
        configMap: {name: dsr1fp8-deepep-config}
---
