# DSR1-FP8 MAX — srt-slurm recipes/gb300-fp8/8k1k/stp/max.yaml (verbatim flags).
# GENERATED BY gen-fp8-point.py — edit the generator, not this file.
# 6 prefill workers (DEP8: tp=dp=ep=8, dp-attn, 2 nodes each = 12 nodes)
# + 1 decode worker (DEP24: tp=dp=ep=24, dp-attn, DeepEP low_latency, 6 nodes)
# + 10 frontends. 18 nodes / 72 GPUs. Concurrencies: [2048, 4096], req_rate inf.
# Image lmsysorg/sglang:v0.5.8.post1-cu130 + ai-dynamo 0.8.0. Model deepseek-ai/DeepSeek-R1-0528 (native FP8).
# Each prefill worker is its OWN 2-node StatefulSet (independent dynamo worker + dist-init leader).
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsr1fp8-max-cd
  namespace: dynamo-cloud
spec:
  numNodes: 18
  channel:
    resourceClaimTemplate:
      name: dsr1fp8-max-cd-channel
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1fp8-max-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: dsr1fp8-max-frontend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1fp8-max-frontend
  namespace: dynamo-cloud
spec:
  replicas: 10
  selector:
    matchLabels:
      app: dsr1fp8-max-frontend
  template:
    metadata:
      labels:
        app: dsr1fp8-max-frontend
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-2
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      containers:
      - name: frontend
        image: lmsysorg/sglang:v0.5.8.post1-cu130
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.0" "ai-dynamo==0.8.0"
          # small-file mirror at the SAME path workers register (/model). Required for discovery,
          # and doubly so here: mid/max set --skip-tokenizer-init, so the frontend tokenizes.
          until python3 -c "
          from huggingface_hub import snapshot_download
          import shutil, glob, os
          pth = snapshot_download('deepseek-ai/DeepSeek-R1-0528', allow_patterns=['*.json','*.py','tokenizer*','*.txt'])
          os.makedirs('/model', exist_ok=True)
          [shutil.copy(f, '/model/') for f in glob.glob(pth + '/*') if os.path.isfile(f)]
          "; do echo "small-file mirror failed, retry in 60s"; sleep 60; done
          exec python3 -m dynamo.frontend --http-port=8000
        env:
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: HF_HOME
          value: /tmp/hf
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - {name: model, mountPath: /model}
      volumes:
      - name: model
        emptyDir: {}
---
