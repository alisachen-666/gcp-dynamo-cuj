dsv4-fp4-gb300-dynamo-sglang-mtp:
  image: lmsysorg/sglang:nightly-dev-20260527-14f81a67
  model: deepseek-ai/DeepSeek-V4-Pro
  model-prefix: dsv4
  runner: gb300
  precision: fp4
  framework: dynamo-sglang
  multinode: true
  disagg: true
  scenarios:
    fixed-seq-len:
    - isl: 8192
      osl: 1024
      search-space:
      # Low-latency baseline: 1p1d-tp4-tp4. 2 nodes.
      - spec-decoding: "mtp"
        conc-list: [1]
        prefill:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-low-latency-1p1d-tp4-tp4-mtp.yaml"
        decode:
          num-worker: 1
          tp: 4
          ep: 1
          dp-attn: false
      # Low-latency 1p6d-dep4-tp4: 1P (DEP=4) + 6 TP=4 decode workers. 7 nodes.
      # Recipe runs concurrencies=8x32x64; matrix tracks the max.
      - spec-decoding: "mtp"
        conc-list: [64]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-low-latency-1p6d-dep4-tp4-mtp.yaml"
        decode:
          num-worker: 6
          tp: 4
          ep: 1
          dp-attn: false
      # Mid curve 1p1d-dep4-dep8. 3 nodes.
      - spec-decoding: "mtp"
        conc-list: [256]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-mid-curve-1p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # Mid curve 1p1d-dep4-dep16. 5 nodes.
      - spec-decoding: "mtp"
        conc-list: [256]
        prefill:
          num-worker: 1
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-mid-curve-1p1d-dep4-dep16-mtp.yaml"
        decode:
          num-worker: 1
          tp: 16
          ep: 16
          dp-attn: true
      # Mid curve 2p1d-dep4-dep8. 4 nodes.
      - spec-decoding: "mtp"
        conc-list: [512]
        prefill:
          num-worker: 2
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-mid-curve-2p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # Mid curve 4p1d-dep4-dep8. 6 nodes.
      - spec-decoding: "mtp"
        conc-list: [1024]
        prefill:
          num-worker: 4
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-mid-curve-4p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # High concurrency 6p1d-dep4-dep8. 8 nodes.
      - spec-decoding: "mtp"
        conc-list: [4096]
        prefill:
          num-worker: 6
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-high-conc-6p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true
      # High concurrency 8p1d-dep4-dep8. 10 nodes.
      - spec-decoding: "mtp"
        conc-list: [8192]
        prefill:
          num-worker: 8
          tp: 4
          ep: 4
          dp-attn: true
          additional-settings:
          - "CONFIG_FILE=recipes/sglang/deepseek-v4/8k1k/disagg-high-conc-8p1d-dep4-dep8-mtp.yaml"
        decode:
          num-worker: 1
          tp: 8
          ep: 8
          dp-attn: true

