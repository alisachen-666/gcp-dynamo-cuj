# DSR1-LLR: RDMA-KV sweep arm of low_latency (1P TP4 + 4D TP4, 5 nodes) — identical to
# lln-lowlatency-nats.yaml (NATS, mult10) except NIXL KV rides GPUDirect RDMA: UCX_TLS
# cuda_copy,rc_x,tcp (no cuda_ipc), GID 5, rail-aware LOCAL_SUBNET/64, 8x mrdma claims.
# Diagnostic transport A/B; MNNVL results remain the record.
# LLN: low_latency re-run with NATS request plane + full mult10 methodology.
# Purpose: (a) close the TCP-vs-NATS parity break for the ll curve, (b) replace the (base)
# methodology runs at conc 4/8 with srt-slurm-exact 2x-warmup/10x-measured points.
# Derived from m4b-lowlatency-1p4d.yaml; only names + request plane changed.
# 8k1k LOW_LATENCY (official InferenceX point): 1 prefill + 4 decode workers, TP=4 each,
# 5 nodes / 20 GPUs. Flags: srt-slurm recipes/gb300-fp4/8k1k/low_latency.yaml (same as M2).
# Model: pre-seeded /model hostPath on all np-2 nodes.
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  name: dsr1-llr-cd
  namespace: dynamo-cloud
spec:
  numNodes: 5
  channel:
    resourceClaimTemplate:
      name: dsr1-llr-cd-channel
---
apiVersion: v1
kind: Service
metadata:
  name: dsr1-llr-frontend
  namespace: dynamo-cloud
spec:
  selector:
    app: dsr1-llr-frontend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1-llr-frontend
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsr1-llr-frontend
  template:
    metadata:
      labels:
        app: dsr1-llr-frontend
    spec:
      containers:
      - name: frontend
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          # mirror small files into /model (= workers' registered model path)
          until python3 -c "
          from huggingface_hub import snapshot_download
          import shutil, glob, os
          p = snapshot_download('nvidia/DeepSeek-R1-0528-NVFP4-v2', allow_patterns=['*.json','*.py','tokenizer*','*.txt'])
          os.makedirs('/model', exist_ok=True)
          [shutil.copy(f, '/model/') for f in glob.glob(p + '/*') if os.path.isfile(f)]
          "; do echo "small-file mirror failed, retry in 60s"; sleep 60; done
          exec python3 -m dynamo.frontend --http-port=8000
        env:
        - name: DYN_REQUEST_PLANE
          value: "nats"
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        - name: HF_HOME
          value: /tmp/hf
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "4"
            memory: 16Gi
        volumeMounts:
        - {name: model, mountPath: /model}
      volumes:
      - name: model
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsr1-llr-prefill
  namespace: dynamo-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsr1-llr-prefill
  template:
    metadata:
      labels:
        app: dsr1-llr-prefill
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: np-3
      tolerations:
      - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      - {key: kubernetes.io/arch, operator: Equal, value: arm64, effect: NoSchedule}
      resourceClaims:
      - name: rdma
        resourceClaimTemplateName: mrdma-all
      - name: compute-domain-channel
        resourceClaimTemplateName: dsr1-llr-cd-channel
      initContainers:
      # NCCL gIB plugin (GPUDirect RoCE transport for NCCL) — raw-manifest port of
      # gpu-recipes network.gibInstall method=apt. Stages /usr/local/gib for the worker.
      - name: nccl-gib-apt-installer
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /etc/apt/trusted.gpg.d/cloud.google.gpg
          echo 'deb https://packages.cloud.google.com/apt gpudirect-gib-apt main' > /etc/apt/sources.list.d/nccl-gib.list
          apt-get update
          apt-get install -y --no-install-recommends nccl-gib
          test -f /usr/local/gib/scripts/set_nccl_env.sh
          mkdir -p /target/usr/local/gib
          cp -a /usr/local/gib/. /target/usr/local/gib/
        volumeMounts:
        - {name: gib, mountPath: /target/usr/local/gib}
      containers:
      - name: prefill
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet "ai-dynamo-runtime==0.8.1" "ai-dynamo==0.8.1"
          [ -f /model/model.safetensors.index.json ] || { echo "MODEL NOT SEEDED on this node"; exit 1; }
          exec python3 -m dynamo.sglang \
            --model-path /model \
            --served-model-name deepseek-ai/DeepSeek-R1 \
            --disaggregation-mode prefill \
            --trust-remote-code \
            --disable-radix-cache \
            --kv-cache-dtype fp8_e4m3 \
            --attention-backend trtllm_mla \
            --quantization modelopt_fp4 \
            --moe-runner-backend flashinfer_trtllm \
            --stream-interval 50 \
            --watchdog-timeout 1000000 \
            --context-length 9600 \
            --mem-fraction-static 0.95 \
            --max-total-tokens 32768 \
            --chunked-prefill-size 24576 \
            --cuda-graph-max-bs 256 \
            --max-running-requests 512 \
            --scheduler-recv-interval 10 \
            --enable-symm-mem \
            --load-balance-method round_robin \
            --disaggregation-bootstrap-port 30001 \
            --data-parallel-size 1 \
            --tensor-parallel-size 4 \
            --expert-parallel-size 1 \
            --fp4-gemm-backend flashinfer_trtllm \
            --disaggregation-transfer-backend nixl \
            --request-plane nats \
            --host 0.0.0.0
        env:
        - name: LD_LIBRARY_PATH
          value: "/usr/local/gib/lib64:/usr/local/ucx/lib:/usr/local/ucx/lib/ucx:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu:/opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/plugins:/usr/local/nvidia/lib64"
        - name: NCCL_DEBUG
          value: "VERSION"
        # control plane
        - name: ETCD_ENDPOINTS
          value: "http://dynamo-platform-etcd.dynamo-cloud.svc.cluster.local:2379"
        - name: NATS_SERVER
          value: "nats://dynamo-platform-nats.dynamo-cloud.svc.cluster.local:4222"
        # model source
        - name: HF_HOME
          value: /data/hf
        - name: HF_HUB_ENABLE_HF_TRANSFER
          value: "1"
        # srt-slurm low_latency prefill_environment
        - name: TORCH_DISTRIBUTED_DEFAULT_TIMEOUT
          value: "1800"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: DYN_SKIP_SGLANG_LOG_FORMATTING
          value: "1"
        - name: SGLANG_USE_MESSAGE_QUEUE_BROADCASTER
          value: "0"
        - name: SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK
          value: "1"
        - name: SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE
          value: "100000"
        - name: SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT
          value: "100000"
        - name: SGLANG_DISAGGREGATION_WAITING_TIMEOUT
          value: "100000"
        - name: SGLANG_DECODE_BOOTSTRAP_TIMEOUT
          value: "1000"
        - name: MC_FORCE_MNNVL
          value: "1"
        - name: MC_TE_METRIC
          value: "true"
        - name: NCCL_MNNVL_ENABLE
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "1"
        - name: SGLANG_MOONCAKE_CUSTOM_MEM_POOL
          value: "True"
        - name: SGLANG_ENABLE_JIT_DEEPGEMM
          value: "false"
        # canonical UCX / transport-evidence block (manifests/worker-env-canonical.yaml)
        - name: UCX_IB_GID_INDEX
          value: "5"
        - name: UCX_IB_ROCE_LOCAL_SUBNET
          value: "y"
        - name: UCX_IB_ROCE_SUBNET_PREFIX_LEN
          value: "64"
        - name: UCX_TLS
          value: "cuda_copy,rc_x,tcp"
        - name: UCX_NET_DEVICES
          value: "mlx5_0:1,mlx5_1:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_7:1"
        - name: UCX_MEMTYPE_CACHE
          value: "n"
        - name: UCX_MEMTYPE_REG_WHOLE
          value: "n"
        - name: UCX_PROTO_INFO
          value: "y"
        - name: UCX_LOG_LEVEL
          value: "info"
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        - name: TP_SOCKET_IFNAME
          value: "eth0"
        resources:
          requests:
            nvidia.com/gpu: "4"
            cpu: "64"
            memory: 512Gi
          limits:
            nvidia.com/gpu: "4"
          claims:
          - name: rdma
          - name: compute-domain-channel
        volumeMounts:
        - {name: gib, mountPath: /usr/local/gib, readOnly: true}
        - {name: dshm, mountPath: /dev/shm}
        - {name: model, mountPath: /model, readOnly: true}
      volumes:
      - {name: gib, emptyDir: {}}
      - name: dshm
        emptyDir: {medium: Memory, sizeLimit: 128Gi}
      - name: model
        hostPath: {path: /mnt/stateful_partition/kube-ephemeral-ssd/dsr1-model, type: Directory}
---
apiVersion: apps/v1
