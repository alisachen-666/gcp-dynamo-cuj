# Low-latency official sweep: conc 4/8/32/64 (srt-slurm 8k1k low_latency benchmark section),
# warmup per concurrency (prompts=conc @ rate 250), measured @ req_rate 300.
apiVersion: batch/v1
kind: Job
metadata:
  name: dsr1-lln-bench
  namespace: dynamo-cloud
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: dsr1-lln-bench
    spec:
      restartPolicy: Never
      containers:
      - name: bench
        image: lmsysorg/sglang:v0.5.8.post1-cu130-runtime
        command: ["bash", "-c"]
        args:
        - |
          set -e
          FRONTEND=dsr1-lln-frontend.dynamo-cloud.svc.cluster.local
          python3 -c "import aiohttp, numpy, pandas, datasets, PIL, tqdm, transformers" 2>/dev/null \
            || pip install --quiet aiohttp numpy pandas datasets Pillow tqdm transformers
          curl -sf http://${FRONTEND}:8000/v1/models | grep -q DeepSeek || { echo "FRONTEND NOT SERVING"; exit 1; }
          cp /sa-bench/*.py /tmp/ && cd /tmp && mkdir -p /tmp/results
          for CONC in 4 8 32 64; do
            echo "===== conc ${CONC}: WARMUP (prompts=${CONC}, rate 250) ====="
            python3 -u benchmark_serving.py \
              --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
              --host ${FRONTEND} --port 8000 \
              --backend dynamo --endpoint /v1/completions \
              --disable-tqdm --dataset-name random \
              --num-prompts $((CONC*2)) \
              --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
              --ignore-eos --request-rate 250 \
              --percentile-metrics ttft,tpot,itl,e2el \
              --max-concurrency ${CONC} --trust-remote-code
            echo "===== conc ${CONC}: MEASURED (prompts=$((CONC*4)), rate 300) ====="
            python3 -u benchmark_serving.py \
              --model deepseek-ai/DeepSeek-R1 --tokenizer nvidia/DeepSeek-R1-0528-NVFP4-v2 \
              --host ${FRONTEND} --port 8000 \
              --backend dynamo --endpoint /v1/completions \
              --disable-tqdm --dataset-name random \
              --num-prompts $((CONC*10)) \
              --random-input-len 8192 --random-output-len 1024 --random-range-ratio 0.8 \
              --ignore-eos --request-rate 300 \
              --percentile-metrics ttft,tpot,itl,e2el \
              --max-concurrency ${CONC} --trust-remote-code \
              --save-result --result-dir /tmp/results \
              --result-filename results_concurrency_${CONC}_gpus_20_ctx_4_gen_16_mult10_nats.json
          done
          for f in /tmp/results/*.json; do echo "--- $f"; cat "$f"; echo ""; done
          for f in /tmp/results/*.json; do
            python3 -c "import json; d=json.load(open('$f')); print('=== SLIM-RESULT', '$f', json.dumps({k:v for k,v in d.items() if not isinstance(v,list)}))"
          done

          echo "LL BENCH C32-MULT10 PASSED"
        env:
        - name: HF_HOME
          value: /tmp/hf
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
        volumeMounts:
        - name: sa-bench
          mountPath: /sa-bench
      volumes:
      - name: sa-bench
        configMap:
          name: sa-bench-scripts
